<style>
/* レイアウト: スマホ幅の1カラムアプリ。上に固定ヘッダー、下に4タブ。PC では中央に 480px で置く */
:root {
  --bg: #eef1f7;

  --ink: #131a2b;

  --good-soft: #e2f4ea;
  --bad: #c0392f;
  --bad-soft: #fbe7e5;
  --warn: #a8701a;
  --warn-soft: #fbf0dc;
  --font-ui: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-text: "Source Serif 4", Georgia, "Times New Roman", serif;
  --radius: 14px;
  --tabbar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1119; --surface: #161b27; --surface-2: #1b2130; --ink: #e6e9f1; --muted: #97a0b4;
    --line: #283044; --accent: #87a3ff; --accent-ink: #0d1119; --accent-soft: #1d2846;
    --good: #52c58f; --good-soft: #15291f; --bad: #ff7f75; --bad-soft: #321a19; --warn: #e2ae4f; --warn-soft: #2e2414;

  }
}
:root[data-theme="dark"] {
  --bg: #0d1119; --surface: #161b27; --surface-2: #1b2130; --ink: #e6e9f1; --muted: #97a0b4;
  --line: #283044; --accent: #87a3ff; --accent-ink: #0d1119; --accent-soft: #1d2846;
  --good: #52c58f; --good-soft: #15291f; --bad: #ff7f75; --bad-soft: #321a19; --warn: #e2ae4f; --warn-soft: #2e2414;
  color-scheme: dark;
}
* { box-sizing: border-box; }

.hero-count { display: flex; align-items: baseline; gap: 6px; }

.score-rows { display: grid; gap: 12px; }

.bar { position: relative; height: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; }

/* 演習 */
.list-btn { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: flex; align-items: center; gap: 12px; }
.list-btn .t { flex: 1; min-width: 0; }

.chev { color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--surface-2); padding: 4px; border-radius: 12px; border: 1px solid var(--line); }

.field { display: grid; gap: 6px; }

.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; min-height: 44px; }

.switch { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.toggle { flex: none; width: 50px; height: 30px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); position: relative; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--muted); transition: transform .15s; }
.toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); background: var(--accent-ink); }

.playbar { position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 10; margin: -16px calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 17px; }
.timer.over { color: var(--bad); }
.passage { font-family: var(--font-text); font-size: 16.5px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
.passage-title { font-family: var(--font-text); font-weight: 600; font-size: 18px; }
.q { display: grid; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }

.opt .bub { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-family: var(--font-ui); font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 1px; }
.opt[aria-pressed="true"] { border-color: var(--accent); }
.opt[aria-pressed="true"] .bub { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }

.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }

.expl { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.blank { display: inline-flex; align-items: baseline; white-space: nowrap; }
.blank input { width: calc(var(--n) * 0.62em + 14px); border: 0; border-bottom: 2px solid var(--accent); background: var(--accent-soft); border-radius: 4px 4px 0 0; padding: 0 4px; font-family: var(--font-text); font-size: 16.5px; letter-spacing: .04em; }
.blank input.ok { border-color: var(--good); background: var(--good-soft); }
.blank input.ng { border-color: var(--bad); background: var(--bad-soft); }
.blank .fix { font-size: 12px; color: var(--good); font-family: var(--font-ui); margin-left: 2px; }
.audio-box { display: grid; gap: 10px; justify-items: start; }
.play-btn { display: inline-flex; align-items: center; gap: 10px; }
.wave { display: inline-flex; gap: 3px; align-items: center; height: 18px; }
.wave i { width: 3px; background: currentColor; border-radius: 2px; height: 30%; animation: wv 1s ease-in-out infinite; }
.wave i:nth-child(2) { animation-delay: .15s } .wave i:nth-child(3) { animation-delay: .3s } .wave i:nth-child(4) { animation-delay: .45s }
@keyframes wv { 50% { height: 100%; } }
@media (prefers-reduced-motion: reduce) { .wave i { animation: none; height: 60%; } .skeleton { animation: none !important; } }
.script { font-family: var(--font-text); font-size: 15px; display: grid; gap: 6px; }
.script b { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-right: 6px; }
.slots { min-height: 52px; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border: 1.5px dashed var(--line); border-radius: 12px; align-items: center; }
.slots.ok { border-color: var(--good); border-style: solid; background: var(--good-soft); }
.slots.ng { border-color: var(--bad); border-style: solid; background: var(--bad-soft); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }

.tile.placed { background: var(--accent-soft); border-color: transparent; }

.tile.placed:disabled { opacity: 1; cursor: default; }
.bubble { background: var(--surface-2); border-radius: 12px 12px 12px 4px; padding: 10px 12px; font-family: var(--font-text); }
.post { border-left: 3px solid var(--line); padding-left: 12px; display: grid; gap: 4px; }
.post.prof { border-color: var(--accent); }
.post b { font-size: 13px; }
.post p { font-family: var(--font-text); }
.diff-word { padding: 0 2px; border-radius: 4px; }
.diff-word.miss { background: var(--bad-soft); color: var(--bad); text-decoration: line-through; }
.diff-word.hit { color: var(--good); }
.big-score { display: flex; align-items: baseline; gap: 8px; }
.big-score b { font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }

@keyframes sk { to { background-position: -200% 0; } }
.notice { font-size: 13px; padding: 10px 12px; border-radius: 10px; background: var(--warn-soft); color: var(--ink); }

.fb-list { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.corr { display: grid; gap: 4px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }
.corr .from { text-decoration: line-through; color: var(--bad); font-family: var(--font-text); }

.goal-grid { display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; align-items: center; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stepper button { width: 40px; height: 40px; border: 0; background: var(--surface-2); font-size: 18px; font-weight: 700; }

.today { display: grid; gap: 12px; }
.today .big-start { min-height: 56px; font-size: 17px; border-radius: 14px; }
.ready-chip { justify-self: start; }
.ctx { display: grid; gap: 8px; }
.ctx .lbl { font-size: 12px; font-weight: 700; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--muted); min-height: 36px; }

</style>

<script>
"use strict";
/* ============================================================
 * reiro TOEFL Drill — プロトタイプ
 * 本番の Next.js + Supabase 版の前に、体験と思想を確かめるための1ファイル版。
 * - AI 生成・採点: claude.use("sample")（使えなければ内蔵サンプル・固定フィードバック）
 * - 読み上げ: claude.use("tts") → ブラウザの speechSynthesis → スクリプト表示
 * - スピーキング: claude.use("dictation")（使えなければ入力欄に打つ）
 * - 保存: この端末のブラウザ（localStorage）のみ
 * ============================================================ */

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel) => document.querySelector(sel);
const LETTERS = ["A", "B", "C", "D"];
const DAY = 86400000;

/* ---------- マスタ ---------- */
const SECTIONS = {
  reading: { ja: "リーディング", en: "Reading", letter: "R" },
  listening: { ja: "リスニング", en: "Listening", letter: "L" },
  writing: { ja: "ライティング", en: "Writing", letter: "W" },
  speaking: { ja: "スピーキング", en: "Speaking", letter: "S" },
};
const SECTION_KEYS = Object.keys(SECTIONS);
const TASKS = [
  { id: "words", section: "reading", en: "Complete the Words", ja: "段落の10語の後半を入力する", mins: 3, engine: "words" },
  { id: "daily", section: "reading", en: "Read in Daily Life", ja: "掲示・メールなどの短文＋3問", mins: 3, engine: "mcq" },
  { id: "academic", section: "reading", en: "Read an Academic Passage", ja: "アカデミックな文章＋5問", mins: 6, engine: "mcq" },
  { id: "choose", section: "listening", en: "Listen and Choose a Response", ja: "1文を聞いて自然な応答を選ぶ（5問）", mins: 2, engine: "choose" },
  { id: "conversation", section: "listening", en: "Listen to a Conversation", ja: "2人の会話＋2問", mins: 3, engine: "listen" },
  { id: "announcement", section: "listening", en: "Listen to an Announcement", ja: "キャンパスのアナウンス＋2問", mins: 2, engine: "listen" },
  { id: "talk", section: "listening", en: "Listen to an Academic Talk", ja: "短い講義＋4問", mins: 4, engine: "listen" },
  { id: "build", section: "writing", en: "Build a Sentence", ja: "語句を並べて返答文を作る（5問）", mins: 3, engine: "build" },
  { id: "email", section: "writing", en: "Write an Email", ja: "3つの要件を満たすメールを書く", mins: 7, engine: "write" },
  { id: "discussion", section: "writing", en: "Write for an Academic Discussion", ja: "授業の掲示板に意見を書く", mins: 10, engine: "write" },
  { id: "repeat", section: "speaking", en: "Listen and Repeat", ja: "7文を聞いてそのまま繰り返す", mins: 2, engine: "repeat" },
  { id: "interview", section: "speaking", en: "Take an Interview", ja: "4つの質問に各45秒で答える", mins: 4, engine: "interview" },
];
const TASK = Object.fromEntries(TASKS.map((t) => [t.id, t]));
const DIFF = {
  easy: { ja: "易", sub: "band 3〜4", prompt: "easy (TOEFL band 3-4, CEFR B1)", adj: -0.5 },
  standard: { ja: "標準", sub: "band 4〜5", prompt: "standard (TOEFL band 4-5, CEFR B2)", adj: 0 },

  choose: '{"items": [5 x {"utterance": string /* one spoken sentence */, "speaker": "female"|"male", "options": [4 strings /* possible replies */], "answer": 0-3, "explanation_ja": string}]}',

  announcement: `{"title": string, "setting_ja": string, "lines": [2-3 x {"speaker": "Announcer", "text": string}] /* 80-130 words total, campus or workplace */, "questions": [2 x ${MCQ_SCHEMA}]}`,

  build: '{"items": [5 x {"context": string /* a question or remark from person A */, "chunks": [4-6 strings in the CORRECT order forming person B\'s reply; last chunk ends with punctuation], "distractor": string /* one extra chunk that does not belong */, "explanation_ja": string}]}',
  email: '{"situation": string, "recipient": string, "tasks": [3 strings], "situation_ja": string}',
  discussion: '{"course": string, "professor": {"name": string, "text": string /* 60-90 words ending with a question */}, "students": [2 x {"name": string, "text": string /* 40-60 words, different views */}], "question_ja": string}',

function seedAttempts() {
  // 6週間分の例。Listening が弱め、Writing は伸びてきている、という設定
  let s = 7;
  const rnd = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
  const base = { reading: 0.74, listening: 0.55, writing: 4.2, speaking: 4.0 };
  const now = Date.now();
  const out = [];
  let cursor = 0;
  for (let d = 41; d >= 1; d--) {
    if (rnd() < 0.3) continue;
    const n = 1 + Math.floor(rnd() * 2);
    for (let k = 0; k < n; k++) {
      const t = TASKS[(cursor++ * 5) % TASKS.length];
      const growth = (41 - d) / 41;
      const diff = rnd() < 0.2 ? "easy" : rnd() < 0.8 ? "standard" : "hard";
      const a = { id: "seed" + d + k, task: t.id, section: t.section, difficulty: diff, date: now - d * DAY - rnd() * 8 * 3600000, duration: Math.round(t.mins * 60 * (0.8 + rnd() * 0.5)), seed: true };
      if (["email", "discussion", "interview"].includes(t.id)) {
        a.band = Math.round((base[t.section] + growth * 0.6 + (rnd() - 0.5)) * 2) / 2;
        a.band = Math.min(6, Math.max(1, a.band));
      } else {
        const p = t.section === "listening" ? base.listening + growth * 0.08 : t.section === "reading" ? base.reading + growth * 0.06 : 0.62 + growth * 0.1;
        const weak = t.id === "conversation" ? -0.12 : t.id === "talk" ? -0.06 : t.id === "build" ? -0.05 : 0;
        a.total = { words: 10, daily: 3, academic: 5, choose: 5, conversation: 2, announcement: 2, talk: 4, build: 5, repeat: 7 }[t.id];
        a.correct = Math.max(0, Math.min(a.total, Math.round(a.total * (p + weak + (rnd() - 0.5) * 0.25))));
      }
      out.push(a);
    }
  }
  return out;
}

const persist = () => { store.set("goals", S.goals); store.set("attempts", S.attempts); store.set("mistakes", S.mistakes); store.set("vocab", S.vocab); store.set("practiceMode", S.practiceMode); store.set("ctx", S.ctx); store.set("askSetup", S.askSetup); store.set("ready", S.ready); store.set("usedSample", S.usedSample); store.set("reminder", S.reminder); };

/* ---------- 推定スコア（本番では lib/estimate.ts） ---------- */
const round05 = (x) => Math.round(x * 2) / 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
function attemptBand(a) {
  if (a.band != null) return a.band;
  const acc = a.correct / a.total;
  return clamp(1 + 5 * acc + DIFF[a.difficulty].adj, 1, 6);
}
function estimate(section, upTo = Infinity) {
  const list = S.attempts.filter((a) => a.section === section && a.date <= upTo).sort((x, y) => y.date - x.date).slice(0, 20);
  if (list.length < 5) return null;
  return round05(list.reduce((s, a) => s + attemptBand(a), 0) / list.length);
}
function estimateTotal(upTo = Infinity) {
  const v = SECTION_KEYS.map((k) => estimate(k, upTo));
  if (v.some((x) => x == null)) return null;
  return round05(v.reduce((s, x) => s + x, 0) / 4);
}
function taskRate(taskId) {
  const list = S.attempts.filter((a) => a.task === taskId).slice(-20);
  if (!list.length) return null;
  return list.reduce((s, a) => s + (a.band != null ? a.band / 6 : a.correct / a.total), 0) / list.length;
}
const CTX_TIME = { short: { ja: "3分", max: 3 }, mid: { ja: "10分", max: 7 }, long: { ja: "じっくり", max: 99 } };
const CTX_SOUND = {
  full: { ja: "声も出せる", ok: () => true },
  listen: { ja: "聞くだけ", ok: (t) => t.section !== "speaking" },
  silent: { ja: "音なし", ok: (t) => t.section === "reading" || t.section === "writing" },
};
const fitsCtx = (t) => t.mins <= CTX_TIME[S.ctx.time].max && CTX_SOUND[S.ctx.sound].ok(t);
function autoDifficulty(section) {
  const e = estimate(section);
  return e == null ? "standard" : e < 3.5 ? "easy" : e < 4.75 ? "standard" : "hard";
}
function recommendation(filter = () => true, exclude = []) {
  const pool = TASKS.filter((t) => filter(t) && !exclude.includes(t.id));
  if (!pool.length) return null;
  let best = null;
  for (const k of SECTION_KEYS) {
    if (!pool.some((t) => t.section === k)) continue;
    const e = estimate(k);
    const gap = e == null ? Infinity : (S.goals[k] ?? 0) - e;
    if (!best || gap > best.gap) best = { section: k, gap, est: e };
  }
  const cands = pool.filter((t) => t.section === best.section).map((t) => ({ t, r: taskRate(t.id) ?? 0 })).sort((a, b) => a.r - b.r);
  return { ...best, task: cands[0].t, rate: cands[0].r };
}
const todayCount = () => S.attempts.filter((a) => a.date >= today0().getTime()).length;
function weekStats() {
  const d = today0(); const dow = (d.getDay() + 6) % 7; const monday = d.getTime() - dow * DAY;
  const list = S.attempts.filter((a) => a.date >= monday);
  return { minutes: Math.round(list.reduce((s, a) => s + (a.duration || 0), 0) / 60), sets: list.length };
}
function streak() {
  const days = new Set(S.attempts.map((a) => isoDate(new Date(a.date))));
  let n = 0; let d = today0().getTime();
  if (!days.has(isoDate(new Date(d)))) d -= DAY; // 今日まだなら昨日から数える
  while (days.has(isoDate(new Date(d)))) { n++; d -= DAY; }
  return n;
}

})();

const Speech = {
  speaking: false,
  voicesFor(lines) {
    const order = []; const map = {};
    const tts = ["airy", "rounded", "glassy", "buttery"];
    for (const l of lines) {
      const key = String(l.speaker || "x").toLowerCase();
      if (!(key in map)) {
        if (key === "female") map[key] = 0; else if (key === "male") map[key] = 1; else if (key === "announcer") map[key] = 3; else if (key === "professor") map[key] = 2;
        else { map[key] = [0, 1, 2, 3].find((i) => !order.includes(i)) ?? order.length % 4; }
        order.push(map[key]);
      }
    }
    return (l) => ({ idx: map[String(l.speaker || "x").toLowerCase()], tts: tts[map[String(l.speaker || "x").toLowerCase()]] });
  },
  available() { return !!ENV.tts || "speechSynthesis" in window; },
  async play(lines) {
    const vf = this.voicesFor(lines);
    this.speaking = true;
    try {
      if (ENV.tts) {
        await ENV.tts.speak(lines.map((l) => ({ text: l.text, voice: vf(l).tts, language: "en" })), { rate: 0.95 });
        return;
      }
      if ("speechSynthesis" in window) {
        const all = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
        for (const l of lines) {
          await new Promise((res, rej) => {
            const u = new SpeechSynthesisUtterance(l.text);
            const i = vf(l).idx;
            u.lang = "en-US"; u.rate = 0.95; u.pitch = [1.15, 0.85, 0.95, 1][i] ?? 1;
            if (all.length) u.voice = all[i % all.length];
            // 音声が用意されていない環境で onend が来ないことがあるので、長さから見積もった時間で打ち切る
            const guard = setTimeout(res, 3000 + l.text.split(/\s+/).length * 600);
            u.onend = () => { clearTimeout(guard); res(); };
            u.onerror = (e) => { clearTimeout(guard); e.error === "interrupted" || e.error === "canceled" ? rej({ code: "stopped" }) : res(); };
            speechSynthesis.speak(u);
          });
        }
        return;
      }
      throw { code: "no_audio" };
    } finally { this.speaking = false; }
  },
  stop() { try { ENV.tts?.stop(); } catch {} try { speechSynthesis.cancel(); } catch {} this.speaking = false; },
};

const Dict = {
  target: null, base: "", listening: false,
  start(targetKey) {
    // クリックの中で同期的に start() を呼ぶ（await を挟まない）
    this.target = targetKey; this.base = (S.p.texts?.[targetKey] || "").trim();
    ENV.dict.start({ language: "en-US" }).catch((e) => { this.listening = false; if (e?.code === "not_granted") toast("音声入力が許可されませんでした。入力欄に打ち込んで回答できます。"); render(); });
    this.listening = true; render();
  },
  stop() { ENV.dict?.stop().catch(() => {}); },
  setText(t) {
    if (!this.target) return;
    S.p.texts = S.p.texts || {};
    S.p.texts[this.target] = t;
    const el = document.getElementById("ta-" + this.target);
    if (el) el.value = t;
  },
  partial(text) { this.setText((this.base + " " + text).trim()); },
  final(text) { this.base = (this.base + " " + text).trim(); this.setText(this.base); },
  state(st) { const was = this.listening; this.listening = st === "listening" || st === "starting"; if (was !== this.listening) render(); },
};

function trendChart() {
  const W = 320, H = 120, L = 28, R = 10, T = 10, B = 22;

  const pts = weeks.filter((w) => w.v != null);
  const y = (v) => T + (H - T - B) * (1 - (v - 1) / 5);
  const x = (i) => L + ((W - L - R) * i) / 5;
  const ticks = [2, 3, 4, 5, 6];
  const target = S.goals.total;
  let path = "", area = "";
  const idx = weeks.map((w, i) => (w.v != null ? i : null)).filter((i) => i != null);
  if (idx.length) {
    path = idx.map((i, k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(weeks[i].v).toFixed(1)}`).join(" ");
    area = path + ` L${x(idx[idx.length - 1]).toFixed(1)},${y(1).toFixed(1)} L${x(idx[0]).toFixed(1)},${y(1).toFixed(1)} Z`;
  }
  const last = idx.length ? idx[idx.length - 1] : null;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="推定スコア（合計）の推移">
    ${ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${t}</text>`).join("")}
    <line x1="${L}" x2="${W - R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ink)" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="${W - R}" y="${y(target) - 4}" text-anchor="end" font-size="10" fill="var(--ink)">目標 ${target.toFixed(1)}</text>

    ${idx.map((i) => `<circle cx="${x(i)}" cy="${y(weeks[i].v)}" r="${i === last ? 4 : 2.5}" fill="${i === last ? "var(--accent)" : "var(--surface)"}" stroke="var(--accent)" stroke-width="1.5"/>`).join("")}
    ${last != null ? `<text x="${x(last) - 6}" y="${y(weeks[last].v) + 16}" text-anchor="end" font-size="11" font-weight="700" fill="var(--accent)">${weeks[last].v.toFixed(1)}</text>` : ""}
    ${weeks.map((w, i) => `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--muted)">${w.label}</text>`).join("")}

function parseWords(text) {
  const parts = String(text).split(/\[\[([^\]]+)\]\]/);
  const blanks = [];
  for (let i = 1; i < parts.length; i += 2) blanks.push(parts[i]);
  return { parts, blanks };
}
function engWords() {
  const p = S.p; const d = p.set; const { parts } = parseWords(d.text);
  let html = ""; let bi = 0;
  parts.forEach((seg, i) => {
    if (i % 2 === 0) { html += esc(seg); return; }
    const w = seg; const show = w.slice(0, Math.floor(w.length / 2)); const rest = w.slice(show.length);
    const k = "b" + bi; const val = p.ans[k] || "";
    let cls = ""; let fix = "";
    if (p.done) { const ok = val.trim().toLowerCase() === rest.toLowerCase(); cls = ok ? "ok" : "ng"; if (!ok) fix = `<span class="fix">${esc(rest)}</span>`; }
    html += `<span class="blank">${esc(show)}<input id="ta-${k}" data-bind="ans.${k}" value="${esc(val)}" maxlength="${rest.length}" style="--n:${rest.length}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${bi + 1}番目の空欄（${rest.length}文字）" class="${cls}" ${p.done ? "disabled" : ""}>${fix}</span>`;
    bi++;

  return `<p class="small muted">段落を読み、欠けている文字を入力してください。各語の前半だけが表示されています。</p>

/* --- Listen and Repeat --- */
function tokens(s) { return String(s).toLowerCase().replace(/[’']/g, "'").match(/[a-z0-9']+/g) || []; }
function lcsDiff(orig, said) {
  const a = tokens(orig), b = tokens(said);
  const dp = Array.from({ length: a.length + 1 }, () => new Array(b.length + 1).fill(0));
  for (let i = a.length - 1; i >= 0; i--) for (let j = b.length - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const marks = []; const extra = []; let i = 0, j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { marks.push({ w: a[i], hit: true }); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { marks.push({ w: a[i], hit: false }); i++; }
    else { extra.push(b[j]); j++; }
  }
  while (i < a.length) marks.push({ w: a[i++], hit: false });
  while (j < b.length) extra.push(b[j++]);
  const hit = marks.filter((m) => m.hit).length;
  return { marks, extra, hit, total: a.length, rate: a.length ? hit / a.length : 0 };
}
function speakInput(key, placeholder) {
  const p = S.p; const listening = Dict.listening && Dict.target === key;
  return `<div class="field">
    ${ENV.dict ? `<button class="btn ${listening ? "primary" : ""}" data-a="${listening ? "dict-stop" : "dict-start"}" data-v="${key}">${ICONS.mic} ${listening ? "話し終えたらタップ" : "話して答える"}</button>` : ""}

function engRepeat() {

/* --- Take an Interview --- */

function planHint() {

let tick = null;
function afterRender() {
  clearInterval(tick);
  saveProgress();
  const p = S.p;
  if (S.tab === "practice" && p.screen === "play" && !p.done) {

    }, 1000);

function newPractice(taskId, extra = {}) {
  const t = TASK[taskId];
  S.p = { screen: "setup", section: t.section, taskId, difficulty: S.p.difficulty || "standard", topic: "", official: !!S.p.official, ...extra };
}
function startPlay(set, source, notice) {
  const p = S.p; const t = TASK[p.taskId];
  Object.assign(p, { screen: "play", set, source, notice: notice || "", ans: {}, texts: {}, played: {}, playing: null, done: false, elapsed: 0, paused: false, step: 0, summary: null, feedback: null, scoring: false, qElapsed: 0, qRunning: false });
  if (t.engine === "build") {
    p.banks = set.items.map((it, i) => shuffle([...it.chunks.map((c, j) => ({ text: c, idx: j })), { text: it.distractor, idx: -1 }], Date.now() % 1000 + i * 17 + 3));
  }
  window.scrollTo(0, 0);
  render();
  setTimeout(() => prefetch(p.taskId), 1500);
}

function pickTopic() {
  const recent = S.attempts.filter((a) => !a.seed && a.topic).slice(-5).map((a) => a.topic);
  const pool = TOPICS.filter((x) => !recent.includes(x));
  return pool[Math.floor(Math.random() * pool.length)] || TOPICS[0];
}
async function generateSet(taskId, difficulty, topic, official, signal) {
  const t = TASK[taskId];
  const seed = Math.random().toString(36).slice(2, 8);
  const prompt = `You are an expert TOEFL iBT item writer for the updated (2026) format. Create ONE wholly original practice set for the task "${t.en}" (${t.section} section). Difficulty: ${DIFF[difficulty].prompt}. Topic: ${topic}. Variation seed: ${seed}. Explanations must be in Japanese. Vary which option letter is correct. Return ONLY JSON matching the schema.${official ? " Model style, length, question stems and distractor logic closely on ETS's officially published TOEFL iBT sample questions, but never reproduce any real item." : ""}\n\nSchema:\n${SCHEMA[t.id]}`;
  let lastErr = null;
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const data = await ENV.sample.json(prompt, { signal, modelTier: "default", cache: false });
      if (VALIDATE[t.id](data)) return data;
      lastErr = { code: "invalid_shape" };
    } catch (e) {
      if (e?.code === "cancelled" || signal?.aborted) throw { code: "cancelled" };
      lastErr = e;
      if (["not_granted", "rate_limited", "sampling_disabled", "capability_disabled"].includes(e?.code)) break;
    }
  }
  throw lastErr || { code: "invalid_shape" };
}

/* 先読み: 解いている間に次の問題を作っておく（許可済みのときだけ。1件ずつ） */
const inflight = new Set();
function prefetch(taskId) {
  if (!ENV.sample || !ENV.sampleGranted || S.ready[taskId] || inflight.has(taskId) || inflight.size >= 1) return;
  const t = TASK[taskId]; const difficulty = autoDifficulty(t.section); const topic = pickTopic();
  inflight.add(taskId);
  generateSet(taskId, difficulty, topic, false).then((set) => {
    S.ready[taskId] = { set, difficulty, topic, at: Date.now() }; persist();
    if (S.tab === "home" || (S.tab === "practice" && S.p.screen === "tasks")) render();
  }).catch(() => {}).finally(() => { inflight.delete(taskId); });
}
function prefetchDaily(exclude = []) {
  const rec = recommendation(fitsCtx, exclude);
  if (rec) prefetch(rec.task.id);
}

/* すぐ始める: 準備済み → それを出す / 初回 → 内蔵サンプル / それ以外 → 生成（待たずにサンプルも選べる） */
function quickStart(taskId) {
  const t = TASK[taskId];
  Speech.stop(); Dict.stop(); clearProgress();
  S.tab = "practice";
  S.p = { screen: "setup", section: t.section, taskId, difficulty: autoDifficulty(t.section), topic: "", official: false };
  const r = S.ready[taskId];
  if (r) {
    delete S.ready[taskId]; persist();
    S.p.difficulty = r.difficulty; S.p.topicSaved = r.topic;
    startPlay(r.set, "ai");
    return;
  }
  if (ENV.sample && S.usedSample[taskId]) { generate(); return; }
  S.usedSample[taskId] = true; persist();
  S.p.topicSaved = null;
  startPlay(SAMPLES[taskId], "sample", ENV.sample ? "<b>1回目は内蔵サンプルですぐ始めます。</b>2回目からは AI が作った新しい問題になります。" : "");
}

let genCtl = null;
async function generate() {
  const p = S.p; const t = TASK[p.taskId];
  const topic = p.topic.trim() || pickTopic();
  Object.assign(p, { screen: "loading", loadStart: Date.now(), topicUsed: topic });
  render();
  genCtl = new AbortController();
  try {
    const data = await generateSet(t.id, p.difficulty, topic, p.official, genCtl.signal);
    ENV.sampleGranted = true;
    if (S.p !== p || p.screen !== "loading") return;
    p.topicSaved = topic; startPlay(data, "ai");
  } catch (e) {
    if (e?.code === "cancelled" || S.p !== p || p.screen !== "loading") return;
    const why = e?.code === "not_granted" ? "AI の利用が許可されませんでした" : e?.code === "rate_limited" ? "AI の利用が混み合っています" : "AI が作った問題の形式が正しくありませんでした";
    p.topicSaved = null;
    startPlay(SAMPLES[t.id], "sample", `<b>${why}。</b>内蔵サンプルに切り替えました。`);
  }
}

/* 途中保存: 中断しても続きから再開できる（この端末のみ） */
S.inProgress = (() => { const r = store.get("inProgress", null); return r && Date.now() - r.at < 2 * DAY ? r : null; })();
function saveProgress() {
  const p = S.p;
  if (S.tab === "practice" && p.screen === "play" && !p.done && !p.scoring) {
    const copy = { ...p, playing: null, paused: false, qRunning: false };
    S.inProgress = { p: copy, at: Date.now() };
    store.set("inProgress", S.inProgress);
  }
}
function clearProgress() { S.inProgress = null; store.set("inProgress", null); }

const DEMO_FEEDBACK = {
  writing: { band: 4.0, summary_ja: "要件にはおおむね触れられていますが、理由の説明が短く、文のつながりが単調です。具体例を1つ加え、接続表現で論理を見せるとさらに上がります。", strengths_ja: ["3つの要件すべてに触れている", "メールとして自然な書き出しと結びになっている"], improvements_ja: ["理由をもう一文、具体的に説明する", "because / so だけでなく however, as a result なども使う", "同じ単語の繰り返しを減らす"], corrections: [{ original: "I can't go because I have a work.", better: "I can't make it because I have to work that day.", why_ja: "work は「仕事」の意味では不可算。make it（都合がつく）も自然です。" }], model_answer: "Dear Jordan,\n\nThank you for organizing this Saturday's hike. Unfortunately, I won't be able to join because I have a part-time shift that I can't change. I was really looking forward to it.\n\nWould it be possible for me to join the next trip later this month? If you share the schedule, I'll make sure to keep that day free.\n\nIn the meantime, I'd be happy to help the club in other ways. For example, I could design a poster for the spring recruitment event or help plan future routes.\n\nBest regards,\nAlex" },
  speaking: { band: 3.5, summary_ja: "質問の意図は理解できています。答えが短めなので、理由と具体例をセットで話すと時間を有効に使えます。", strengths_ja: ["各質問にまず結論から答えている"], improvements_ja: ["理由を2つ挙げて45秒を使い切る", "For example, ... で自分の体験を入れる"], corrections: [{ original: "I think phone is bad.", better: "I think banning phones in class is a good idea.", why_ja: "質問の言葉を使って立場をはっきり言うと伝わりやすくなります。" }], per_question: [{ comment_ja: "体験の場面をもう少し具体的に。", better_answer: "Last year I used a language app every morning on the train, and in three months I could read simple news articles in Spanish." }], model_answer: "I think it's a good idea for schools to ban phones in classrooms. First, phones are a huge distraction..." },
};
let scoreCtl = null;
async function score() {
  const p = S.p; const t = TASK[p.taskId]; const d = p.set;
  p.scoring = true; p.qRunning = false; render();
  const isSpeak = t.section === "speaking";
  let taskDesc, response;
  if (t.id === "email") { taskDesc = `Situation: ${d.situation}\nRecipient: ${d.recipient}\nThe email must: ${d.tasks.map((x, i) => `(${i + 1}) ${x}`).join(" ")}\nTime limit: 7 minutes.`; response = p.texts.main; }
  else if (t.id === "discussion") { taskDesc = `Course: ${d.course}\nProfessor ${d.professor.name}: ${d.professor.text}\n${d.students.map((s) => `${s.name}: ${s.text}`).join("\n")}\nTime limit: 10 minutes.`; response = p.texts.main; }
  else { taskDesc = `Interview topic: ${d.topic}. The test taker answers each question in 45 seconds. Responses are speech transcripts (no pronunciation information).`; response = d.questions.map((q, i) => `Q${i + 1}: ${q}\nA${i + 1}: ${p.texts["i" + i] || "(no response)"}`).join("\n\n"); }
  const schema = `{"band": number /* 1-6 in 0.5 steps */, "summary_ja": string, "strengths_ja": [strings], "improvements_ja": [strings], "corrections": [up to 5 x {"original": string, "better": string, "why_ja": string}], "model_answer": string${isSpeak ? ', "per_question": [4 x {"comment_ja": string, "better_answer": string}]' : ""}}`;
  const prompt = `You are an experienced TOEFL iBT rater for the updated (2026) format. Score the test taker's response to the "${t.en}" task on the 1-6 band scale in 0.5 steps, judging task completion, development, organization, vocabulary and grammar${isSpeak ? " (content, vocabulary and grammar only, since this is a transcript)" : ""}. Write all feedback in Japanese, except "original", "better", "better_answer" and "model_answer", which are in English. Return ONLY JSON matching the schema.\n\nTASK\n${taskDesc}\n\nRESPONSE\n${response}\n\nSchema:\n${schema}`;
  let fb = null;
  if (ENV.sample) {
    scoreCtl = new AbortController();
    try {
      const r = await ENV.sample.json(prompt, { signal: scoreCtl.signal, modelTier: "default", cache: false });
      if (S.p !== p) return;
      if (r && typeof r.band === "number") fb = { ...r, band: clamp(round05(r.band), 1, 6) };
    } catch (e) {
      if (e?.code === "cancelled") return;
    }
  }
  if (S.p !== p) return;
  if (!fb) fb = { ...DEMO_FEEDBACK[isSpeak ? "speaking" : "writing"], demo: true };
  p.feedback = fb; p.scoring = false;
  finish({ band: fb.band, note: fb.demo ? "デモ用の固定フィードバックです。" : "AI による目安の採点です。" });
}

function finish(result) {
  const p = S.p; const t = TASK[p.taskId];
  p.done = true; p.summary = result;
  Speech.stop();
  clearProgress();
  setTimeout(() => { prefetch(p.taskId); prefetchDaily([p.taskId]); }, 0);
  const attempt = { id: "a" + Date.now(), task: t.id, section: t.section, difficulty: p.difficulty, date: Date.now(), duration: p.elapsed, topic: p.topicSaved || null };
  if (result.band != null) attempt.band = result.band; else { attempt.correct = result.correct; attempt.total = result.total; }
  S.attempts.push(attempt);
  (result.mistakes || []).forEach((q, i) => S.mistakes.unshift({ id: attempt.id + "-" + i, task: t.id, q, date: Date.now(), resolved: false }));
  persist();
  window.scrollTo(0, 0);
  render();
}

function grade() {
  const p = S.p; const t = TASK[p.taskId]; const d = p.set;
  if (t.engine === "words") {
    const { blanks } = parseWords(d.text);
    const correct = blanks.filter((w, i) => (p.ans["b" + i] || "").trim().toLowerCase() === w.slice(Math.floor(w.length / 2)).toLowerCase()).length;
    return finish({ correct, total: blanks.length });
  }
  if (t.engine === "mcq" || t.engine === "listen") {
    const wrong = d.questions.filter((q, i) => p.ans["q" + i] !== q.answer);
    return finish({ correct: d.questions.length - wrong.length, total: d.questions.length, mistakes: wrong });
  }
  if (t.engine === "choose") {
    const wrong = d.items.filter((it, i) => p.ans["q" + i] !== it.answer);
    return finish({ correct: d.items.length - wrong.length, total: d.items.length, mistakes: wrong.map((it) => ({ q: "(Audio) " + it.utterance, options: it.options, answer: it.answer, explanation_ja: it.explanation_ja })) });
  }
  if (t.engine === "build") {
    const correct = d.items.filter((it, i) => (p.ans["s" + i] || []).map((ci) => p.banks[i][ci].idx).join("|") === it.chunks.map((_, j) => j).join("|")).length;
    return finish({ correct, total: d.items.length });
  }
  if (t.engine === "repeat") {
    const rs = d.sentences.map((s, k) => lcsDiff(s, p.texts["r" + k] || ""));
    const avg = rs.reduce((s, r) => s + r.rate, 0) / rs.length;
    return finish({ correct: rs.filter((r) => r.rate >= 0.8).length, total: 7, note: `単語の一致率 平均 ${Math.round(avg * 100)}%。80%以上の文を正解として数えています。` });
  }
}

/* ---------- イベント ---------- */
const A = {
  tab(el) { Speech.stop(); Dict.stop(); saveProgress(); if (S.p.screen === "play" && !S.p.done) S.p = { screen: "sections" }; S.tab = el.dataset.v; window.scrollTo(0, 0); render(); },
  quick(el) { quickStart(el.dataset.v); },
  ctx(el) { S.ctx[el.dataset.k] = el.dataset.v; persist(); render(); if (ENV.sampleGranted) prefetchDaily(); },
  resume() { const r = S.inProgress; if (!r) return; S.tab = "practice"; S.p = { ...r.p, playing: null, paused: false }; window.scrollTo(0, 0); render(); },
  discard() { clearProgress(); render(); },
  "toggle-ask"() { S.askSetup = !S.askSetup; persist(); render(); },
  "p-sample-now"() { genCtl?.abort(); S.p.topicSaved = null; startPlay(SAMPLES[S.p.taskId], "sample"); },
  "p-done"() { S.p = { screen: "sections" }; S.tab = "home"; window.scrollTo(0, 0); render(); },
  "toggle-practice"() { S.practiceMode = !S.practiceMode; persist(); render(); },
  "p-section"(el) { S.p = { screen: "tasks", section: el.dataset.v }; render(); },
  "p-task"(el) { if (S.askSetup) { newPractice(el.dataset.v); S.p.difficulty = autoDifficulty(TASK[el.dataset.v].section); render(); } else quickStart(el.dataset.v); },
  "p-back"() {
    const p = S.p; Speech.stop(); Dict.stop(); genCtl?.abort(); scoreCtl?.abort();
    if (p.screen === "tasks") S.p = { screen: "sections" };
    else if (p.screen === "setup") S.p = { screen: "tasks", section: p.section };
    else if (p.screen === "play" && !p.done) { saveProgress(); S.p = { screen: "tasks", section: p.section }; toast("途中まで保存しました。ホームから続きを再開できます。"); }
    else S.p = { screen: "tasks", section: p.section };
    render();
  },
  "p-diff"(el) { S.p.difficulty = el.dataset.v; render(); },
  "p-official"() { S.p.official = !S.p.official; render(); },
  "p-generate"() { generate(); },
  "p-sample"() { S.p.topicSaved = null; startPlay(SAMPLES[S.p.taskId], "sample"); },
  "p-cancel"() { genCtl?.abort(); S.p.screen = "setup"; render(); },
  "p-cancel-score"() { scoreCtl?.abort(); S.p.scoring = false; render(); },
  "p-pause"() { S.p.paused = !S.p.paused; render(); },
  "p-submit"() { Speech.stop(); Dict.stop(); grade(); },
  "p-score"() { Speech.stop(); Dict.stop(); score(); },
  "p-again"() { const p = S.p; newPractice(p.taskId, { difficulty: p.difficulty, topic: p.topic, official: p.official }); render(); },
  "p-home"() { S.p = { screen: "sections" }; render(); },
  pick(el) { if (S.p.done) return; S.p.ans[el.dataset.q] = Number(el.dataset.v); render(); },
  place(el) { const i = el.dataset.i; const k = "s" + i; S.p.ans[k] = [...(S.p.ans[k] || []), Number(el.dataset.v)]; render(); },
  unplace(el) { const k = "s" + el.dataset.i; const arr = (S.p.ans[k] || []).slice(); arr.splice(Number(el.dataset.v), 1); S.p.ans[k] = arr; render(); },
  play(el) {
    const p = S.p; const key = el.dataset.v;
    if (p.playing === key) { Speech.stop(); p.playing = null; render(); return; }
    const t = TASK[p.taskId]; const d = p.set;
    let lines;
    if (key === "main") lines = d.lines;
    else if (key.startsWith("u")) { const it = d.items[Number(key.slice(1))]; lines = [{ speaker: it.speaker, text: it.utterance }]; }
    else if (key.startsWith("r")) lines = [{ speaker: "guide", text: d.sentences[Number(key.slice(1))] }];
    else if (key.startsWith("q")) { const i = Number(key.slice(1)); lines = i === 0 ? [{ speaker: "interviewer", text: d.intro }, { speaker: "interviewer", text: d.questions[0] }] : [{ speaker: "interviewer", text: d.questions[i] }]; }
    p.playing = key; render();
    Speech.play(lines).then(() => {
      if (S.p !== p) return;
      p.played[key] = true; p.playing = null;
      if (t.engine === "interview") { p.qRunning = true; p.qElapsed = 0; }
      render();
    }).catch((e) => {
      if (S.p !== p) return;
      p.playing = null;
      if (e?.code !== "stopped" && e?.code !== "viewer_stopped") { p.played[key] = true; toast("音声を再生できませんでした。スクリプトを表示します。"); }
      render();
    });
  },
  "dict-start"(el) { if (!ENV.dict) return; Dict.start(el.dataset.v); },
  "dict-stop"() { Dict.stop(); },
  "rep-next"() { Speech.stop(); Dict.stop(); S.p.step++; render(); },
  "int-next"() { Speech.stop(); Dict.stop(); S.p.step++; S.p.qRunning = false; S.p.qElapsed = 0; render(); },
  "rev-open"(el) { S.review = { open: el.dataset.v, picked: null }; render(); },
  "rev-pick"(el) { const m = S.mistakes.find((x) => x.id === S.review.open); S.review.picked = Number(el.dataset.v); if (m && S.review.picked === m.q.answer) { m.resolved = true; m.keepOpen = true; } persist(); render(); },
  "rev-close"() { S.review = { open: null }; S.mistakes.forEach((m) => delete m.keepOpen); render(); },
  "vocab-add"() { const w = (S.vw || "").trim(); if (!w) { toast("単語を入力してください"); return; } S.vocab.unshift({ word: w, meaning_ja: (S.vm || "").trim(), example: "" }); S.vw = ""; S.vm = ""; persist(); render(); toast("単語帳に追加しました"); },
  "vocab-del"(el) { S.vocab.splice(Number(el.dataset.v), 1); persist(); render(); },
  "g-step"(el) { const k = el.dataset.k; S.goals[k] = clamp(round05(S.goals[k] + Number(el.dataset.v)), 1, 6); persist(); render(); },
  "g-num"(el) { const k = el.dataset.k; const min = k === "weeklySets" ? 1 : 30; S.goals[k] = Math.max(min, S.goals[k] + Number(el.dataset.v)); persist(); render(); },
  reset() { S.attempts = seedAttempts(); S.mistakes = []; persist(); toast("学習データをサンプルに戻しました"); render(); },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if (fn) fn(el, e);
});
document.addEventListener("input", (e) => {
  const el = e.target; const path = el.dataset?.bind; if (!path) return;
  const parts = path.split(".");
  let obj = parts[0] === "goals" ? S.goals : parts[0] === "ans" ? S.p.ans : parts[0] === "texts" ? (S.p.texts = S.p.texts || {}) : null;
  if (obj) obj[parts[1]] = el.value; else if (parts[0] === "topic") S.p.topic = el.value; else S[parts[0]] = el.value;
  if (parts[0] === "reminder") persist();
  if (parts[0] === "goals") persist();
  if (path === "texts.main") {
    const wc = document.getElementById("wc"); const n = wordCount(el.value);
    if (wc) wc.textContent = n + " 語";
    const b = document.getElementById("score-btn"); if (b) b.disabled = n < 20;
  }
  if (Dict.target && path === "texts." + Dict.target) Dict.base = el.value;
});
document.addEventListener("change", (e) => { if (e.target.dataset?.bind === "goals.examDate") render(); });

render();
</script>
